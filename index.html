
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copa Sem Conexão</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101414;
      color: white;
    }
    header {
      background: #182522;
      padding: 30px 15px;
      text-align: center;
      border-bottom: 3px solid #a6ff4d;
    }
    h1 { margin: 0; }
    main {
      max-width: 600px;
      margin: 35px auto;
      padding: 16px;
    }
    h2 { color: #a6ff4d; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #19201e;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 16px 12px;
      border-bottom: 1px solid #35413b;
    }
    th {
      color: #a6ff4d;
      text-align: left;
    }
    th:last-child, td:last-child {
      text-align: right;
    }
    .pontos {
      font-size: 20px;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #aab5ae;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚽ COPA SEM CONEXÃO</h1>
    <p>Classificação oficial</p>
  </header>

  <main>
    <h2>🏆 Pontuação</h2>
    <table>
      <thead>
        <tr>
          <th>Jogador</th>
          <th>Pontos</th>
        </tr>
      </thead>
      <tbody id="classificacao"></tbody>
    </table>
  </main>

  <footer>Copa Sem Conexão © 2026</footer>

  <script>
    const jogadores = [
      { nome: "ALANY", pontos: 0 },
      { nome: "RAMON", pontos: 0 },
      { nome: "ODAIR", pontos: 0 },
      { nome: "TIAGO", pontos: 0 },
      { nome: "ERNANDO", pontos: 0 },
      { nome: "MATHEUS", pontos: 0 },
      { nome: "DOUGLAS", pontos: 0 }
    ];

    jogadores.sort((a, b) => b.pontos - a.pontos);

    document.getElementById("classificacao").innerHTML =
      jogadores.map(j => `
        <tr>
          <td>${j.nome}</td>
          <td class="pontos">${j.pontos}</td>
        </tr>
      `).join("");
  </script>
</body>
</html>
